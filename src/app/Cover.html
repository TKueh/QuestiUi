<style>
  /* Questi-Titelblatt 960 × 288 – wie das Nordhaus-Titelblatt (Markenausnahme, Gestaltungsregeln 13: Breite, Titel 88 px). Alle Werte aus Nordhaus tokens.css. */
  .qs-cover {
    position: relative;
    width: 960px;
    height: 288px;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
  }
  .qs-cover-art {
    position: absolute;
    top: 0;
    left: 480px;
    width: 480px;
    height: 288px;
    overflow: hidden;
  }
  .qs-cover-art svg {
    display: block;
    width: 480px;
    height: 288px;
  }
  .qs-cover-ink {
    fill: var(--ink);
  }
  .qs-cover-key {
    fill: var(--key);
  }
  .qs-cover-action {
    fill: var(--action);
  }
  .qs-cover-led {
    fill: var(--positive);
  }
  .qs-cover-tick {
    stroke: var(--on-ink-muted);
    stroke-width: 1;
  }
  .qs-cover-tick.is-major {
    stroke: var(--on-ink);
  }
  .qs-cover-needle {
    stroke: var(--marker);
    stroke-width: 2;
  }
  .qs-cover-panel {
    rx: var(--radius-xs);
  }
  .qs-cover-words {
    position: absolute;
    left: var(--space-6);
    bottom: var(--space-6);
    max-width: 440px;
  }
  /* Markenausnahme: 88 px nur auf dem Titelblatt (Register 13); Laufweite wie numeral */
  .qs-cover-name {
    margin: 0;
    font-size: 88px;
    line-height: 0.95;
    font-weight: 300;
    letter-spacing: var(--tracking-numeral);
    color: var(--ink);
  }
  .qs-cover-tag {
    margin: var(--space-3) 0 0 var(--space-1);
    font: var(--text-subhead);
    letter-spacing: var(--tracking-subhead);
    color: var(--ink-muted);
  }
</style>
<div class="qs-cover">
  <div class="qs-cover-art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        Aufbau: Graphit-Tafel 336 × 200 über den Rand oben und rechts (die Front, die Identität) · helles Tastenfeld 144 × 192
        über den Rand unten · eine runde Taste ⌀ 48 in action (die AddButton-Taste) · LED ⌀ 6 in positive.
        Anordnung: eine Gerätefront auf dem 48er-Raster (space-12), wie ein Braun-Bedienfeld.
        Muster: die Scale des Systems – 31 Haarlinien im Abstand 8 (space-2), jede fünfte lang, ein Zeiger in marker.
        Maße: Raster 48 = space-12 · Strichabstand 8 = space-2 · Taste 48 · Ecken radius-xs (Tafeln), radius-full (LED, Taste).
      -->
      <rect class="qs-cover-ink qs-cover-panel" x="144" y="-8" width="344" height="208" />
